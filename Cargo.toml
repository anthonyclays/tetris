[package]
name = "frustration-tetris"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Anthony Clays <anthonyclays@gmail.com>"]
description = "A Tetris clone with a twist: every piece is a rigid body."

[features]
default = ["tetrominos"]
# Which family of polyominoes to play with. `pentominos` takes precedence
# when both are enabled, so `--features pentominos` is enough.
tetrominos = []
pentominos = []

[dependencies]
ab_glyph = "0.2"
rand = "0.10"
rapier2d = "0.35"

# macroquad frontend (window, input, batched 2D drawing and text in one crate)
macroquad = "0.4"

[profile.release]
codegen-units = 1
lto = "thin"
