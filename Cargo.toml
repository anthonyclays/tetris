[package]
name = "frustration-tetris"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Anthony Clays <anthonyclays@gmail.com>"]
description = "A Tetris clone with a twist: every piece is a rigid body."

[features]
default = ["tetrominos"]
# Which family of polyominoes to play with. `pentominos` takes precedence
# when both are enabled, so `--features pentominos` is enough.
tetrominos = []
pentominos = []

[dependencies]
ab_glyph = "0.2"
rand = "0.10"
rapier2d = "0.35"

# wgpu frontend
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "30"
winit = "0.30"

[dev-dependencies]
png = "0.17"

[profile.release]
codegen-units = 1
lto = "thin"
